schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: tema Shopify "Horizon" (Liquid) del negocio Hope.
  Tienda: hopesweet.myshopify.com (password de storefront para pruebas: loldet).
  Productos clave:
    - Helado Hope (gid 9116101411068, handle helado-hope) — base $6/$7.50/$9.
    - Mixo Hope (gid 9454592786684, handle mixo-hope) — base $5/$7/$9, template helado-v2.
    - Milkshake (gid 9461419311356, handle milkshake) — combos de opción única a $7.
  Add-on de extras premium: producto extras-personalizados, variant 67600613900540 @ $1.50.

  Convenciones:
    - CSS/JS de los armadores scopeados bajo .hopecfg; assets en assets/, secciones en sections/.
    - Imágenes por swap Cloudinary (cuenta slealu5f, carpeta hope/catalog).
    - Despliegue del tema: `shopify theme push`; mutaciones de datos/tienda:
      `shopify store execute --allow-mutations`.
    - Verificación de UI: Playwright contra `shopify theme dev` (127.0.0.1:9292).
    - Las carpetas openspec/ y .claude/ NO se suben con `theme push` (no son dirs de tema).

  Cobertura de specs sembrados: configurador-helado, cobro-extras, carrito-nativo,
  productos-catalogo. Reflejan el estado desplegado al 2026-09-30 a partir de notas previas;
  ante discrepancia, el código y la tienda son la verdad.

